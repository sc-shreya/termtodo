name: Run on Alpine

on:
  push:
    branches: ["master"]

jobs:
  run-on-alpine:
    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Python
        run: apk add --no-cache python3 py3-pip

      - name: Run your program
        run: echo -e "2\n3" | python3 app.py
